<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bangladesh Map — বাংলাদেশের প্রশাসনিক মানচিত্র</title>
  <meta name="description" content="Interactive map of every division, district, upazila and union in Bangladesh, with open data and a static JSON API.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 6%22%3E%3Crect width=%2210%22 height=%226%22 fill=%22%23006a4e%22/%3E%3Ccircle cx=%224.5%22 cy=%223%22 r=%222%22 fill=%22%23f42a41%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="alternate" type="application/json" href="/api/v1/index.json" title="Static JSON API">
</head>
<body>
  <header class="bar">
    <a class="brand" href="#">বাংলাদেশ <span>Bangladesh Map</span></a>
    <div class="search">
      <input id="q" type="search" placeholder="Search any area · যেকোনো এলাকা খুঁজুন" autocomplete="off" aria-label="Search" aria-controls="results">
      <ul id="results" role="listbox" hidden></ul>
    </div>
    <div id="lang" role="group" aria-label="Language / ভাষা">
      <button type="button" data-lang="bn" lang="bn">বাংলা</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
  </header>

  <main>
    <section class="map-wrap">
      <svg id="map" role="img" aria-label="Map of Bangladesh"></svg>
      <div id="tip" hidden></div>
      <p id="status" class="status" hidden></p>
    </section>

    <aside id="panel" aria-live="polite">
      <nav id="crumbs" aria-label="Breadcrumb"></nav>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <dl id="facts"></dl>
      <p id="note" class="note" hidden></p>
      <h2 id="children-title"></h2>
      <ul id="children"></ul>
    </aside>
  </main>

  <footer>
    Boundaries: BBS via OCHA/HDX (CC BY-IGO). Unions: 2015 BBS boundaries.
    Bangla names: nuhil/bangladesh-geocode (MIT).
    Population: BBS Census 2011 via US Census Bureau (CC BY); 2022 estimates UNFPA COD-PS (CC BY-IGO).
    · <a href="/api/v1/index.json">API</a> · <a href="/data/gazetteer/units.csv">CSV</a> · <a href="/llms.txt">llms.txt</a>
  </footer>

  <script src="/vendor/d3-array.min.js"></script>
  <script src="/vendor/d3-geo.min.js"></script>
  <script src="/vendor/topojson-client.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
